<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - Register</title>
    <link rel="icon" href="../../Assets/BloomLogo.png" type="image/png">
    <link rel="stylesheet" href="../../css/styles.css">
</head>

<body>
    <div class="CenterBox">
        <h1 style="text-align: center; margin-bottom: 0;">Welcome To Bloom!</h1>
        <p style="text-align: center; margin-top: 4px; font-size: 14px; color: grey;">Please enter your details to create an account.</p>
        <input id="username" type="text" aria-label="Username" placeholder="Username">
        <input id="email" type="email" aria-label="Email" placeholder="Email">
        <input id="password" type="password" aria-label="Password" placeholder="Password">
        <input id="birthday" type="date" aria-label="Birthday" placeholder="Birthday">
        <p style="font-size: 12px; color: grey;">By signing up, you agree to our <a href="../legal/terms.html">Terms of Service</a> and <a href="../legal/privacy.html">Privacy Policy</a>.</p>
        <p style="font-size: 15px; color: grey;">Already have an account? <a href="login.html">Log in</a></p>
        <p id="error-message" style="color: red; text-align: center; margin-top: 10px;"></p>
        <button id="LoginButton">Sign Up</button>
        
    </div>
    <script type="module" src="../../js/i18n.js"></script>
    <script type="module" src="../../js/register.js"></script>
</body>
