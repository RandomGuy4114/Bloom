<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - Login</title>
    <link rel="icon" href="../../../Assets/BloomLogo.png" type="image/png">
    <link rel="stylesheet" href="../../../css/styles.css">
</head>

<body>
    <div class="CenterBox">
        <h1 style="text-align: center; margin-bottom: 0;">Welcome Back To Bloom!</h1>
        <p style="text-align: center; margin-top: 4px; font-size: 14px; color: grey;">Please enter your credentials to access your account.</p>
        <form id="loginForm" class="auth-form">
            <label for="EmailInput">Email</label>
            <input id="EmailInput" type="email" placeholder="Email" autocomplete="email" required>
            <label for="PasswordInput">Password</label>
            <input id="PasswordInput" type="password" placeholder="Password" autocomplete="current-password" required>
            <button id="forgotPasswordButton" type="button" class="auth-link-button">Forgot password?</button>
            <p id="error-message" class="form-error" role="alert" aria-live="polite"></p>
            <button id="LoginButton" type="submit">Log In</button>
        </form>
        <p style="font-size: 15px; color: grey;">Don't have an account? <a href="../register/">Sign up</a></p>
    </div>
    <script type="module" src="../../../js/i18n.js"></script>
    <script type="module" src="../../../js/login.js"></script>
</body>
</html>
