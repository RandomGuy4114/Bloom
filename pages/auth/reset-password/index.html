<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - Reset Password</title>
    <link rel="icon" href="../../../Assets/BloomLogo.png" type="image/png">
    <link rel="stylesheet" href="../../../css/styles.css">
</head>
<body>
    <div class="CenterBox">
        <h1>Reset Password</h1>
        <p class="auth-intro">Choose a new password for your Bloom account.</p>
        <form id="resetPasswordForm" class="auth-form">
            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" autocomplete="new-password" minlength="12" required>
            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
            <p class="auth-help">Use at least 12 characters with uppercase, lowercase, and a number.</p>
            <p id="error-message" class="form-error" role="alert" aria-live="polite"></p>
            <button type="submit">Update password</button>
        </form>
    </div>
    <script type="module" src="../../../js/i18n.js"></script>
    <script type="module" src="../../../js/reset-password.js"></script>
</body>
</html>
