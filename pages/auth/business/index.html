<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - Business Register</title>
    <link rel="icon" href="../../../Assets/BloomLogo.png" type="image/png">
    <link rel="stylesheet" href="../../../css/styles.css">
</head>

<body>
    <div class="CenterBox">
        <h1 style="text-align: center; margin-bottom: 0;">Register a Business Account</h1>
        <p style="text-align: center; margin-top: 4px; font-size: 14px; color: grey;">Please enter your details to create an account.</p>
        <form id="registerForm" class="auth-form">
            <label for="username">Business Username</label>
            <input id="username" type="text" placeholder="Username" autocomplete="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" required>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Email" autocomplete="email" required>
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Password" autocomplete="new-password" minlength="8" aria-describedby="passwordRequirements" required>
            <p id="passwordRequirements" class="auth-help">Use at least 8 characters with uppercase, lowercase, and a number.</p>
            <label for="birthday">Birthday</label>
            <input id="birthday" type="date" autocomplete="bday" min="1906-01-01" required>
            <label class="terms-consent" for="termsAccepted">
                <input id="termsAccepted" type="checkbox" required>
                <span>I agree to the <a href="../../legal/terms/">Terms of Service</a> and <a href="../../legal/privacy/">Privacy Policy</a>.</span>
            </label>
            <p id="error-message" class="form-error" role="alert" aria-live="polite"></p>
            <button id="LoginButton" type="submit">Sign Up</button>
        </form>
        <p style="font-size: 15px; color: grey;">Already have an account? <a href="../login/">Log in</a></p>
    </div>
    <script type="module" src="../../../js/i18n.js"></script>
    <script type="module" src="../../../js/company-register.js"></script>
</body>
</html>
