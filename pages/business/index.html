<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - Business</title>
    <link rel="icon" href="../../../Assets/BloomLogo.png" type="image/png">
    <link rel="stylesheet" href="../../../css/styles.css">
</head>
<body class="landing-page">
    <main>
        <section id="Divider" aria-labelledby="Logo">
                <div class="LeftSide">
                    <h1 id="Logo">Bloom For Business</h1>
                    <p id="Subtitle">Connect your business to Bloom.</p>
                    <button type="button" id="GetStartedButton" onclick="window.location.href='../auth/business/'">Get Started</button>
                    <p class="landing-attribution">An open-source project by FormalBlaze</p>
                </div>
                <div class="RightSide">
                    <img src="../../../Assets/BusinessImage.webp" alt="People connecting through their local community" id="MainImage" width="1400" height="933" decoding="async" fetchpriority="high">
                </div>    
        </section>
    </main>
</body>
</html>
