<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloom - Business Settings</title><link rel="icon" href="../../../Assets/BloomLogo.png"><link rel="stylesheet" href="../../../css/styles.css"></head>
<body class="app-page">
<header class="topbar"><h1 class="topbar-logo">Bloom <span id="verText">BUSINESS</span></h1><nav aria-label="Account" style="display:flex;align-items:center"><p id="username-label" style="margin:10px"></p><div class="pfp-frame"></div></nav><div class="topbar-actions" aria-label="Mobile navigation"><div class="topbar-action-row"><button data-business-route="businessHome">Business Home</button><button data-business-route="businessProfile">Business Profile</button></div><div class="topbar-action-row"><button data-business-route="businessSettings">Business Settings</button><button data-business-route="businessDashboard">Business Dashboard</button></div></div></header>
<aside class="sidebar" aria-label="Business navigation"><button class="sidebarButton" data-business-route="businessHome">Business Home</button><button class="sidebarButton" data-business-route="businessProfile">Business Profile</button><div class="divider"></div><button class="sidebarButton" data-business-route="businessSettings">Business Settings</button><button class="sidebarButton" data-business-route="businessDashboard">Business Dashboard</button></aside>
<main class="main-layout"><div class="settings-container settings-dashboard"><header class="settings-header"><p class="settings-eyebrow">Bloom for Business</p><h1>Business Settings</h1><p>Manage preferences for your business account.</p></header><div class="settings-grid">
<section class="settings-card"><h2>Appearance</h2><label for="businessTheme">Theme</label><select id="businessTheme"></select><button id="saveBusinessTheme">Apply Theme</button></section>
<section class="settings-card"><h2>Language</h2><label for="businessLanguage">Language</label><select id="businessLanguage"><option value="en">English</option><option value="es">Spanish</option></select><button id="saveBusinessLanguage">Change Language</button></section>
<section class="settings-card"><h2>Business Profile</h2><p>Update your public business information and contact details.</p><button data-business-route="businessProfile">Edit Business Profile</button></section>
<section class="settings-card"><h2>Session</h2><p>Sign out of your Bloom business account on this device.</p><button id="businessLogout" class="secondary-action">Log Out</button></section>
</div><p id="businessSettingsMessage" role="status" aria-live="polite"></p></div></main><script type="module" src="../../../js/i18n.js"></script><script type="module" src="../../../js/business-settings.js"></script></body></html>
