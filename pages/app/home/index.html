<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - Dashboard</title>
    <link rel="icon" href="../../../Assets/BloomLogo.png" type="image/png">
    <link rel="stylesheet" href="../../../css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="home-page">
    <div class="topbar">
        <h1 class="topbar-logo">Bloom <p id="verText">ALPHA</p></h1>
        <nav style="display: flex; align-items: center;">
            <p id="username-label" style="margin: 10px;"></p>
            <div class="pfp-frame"></div>
        </nav>
        <div class="topbar-actions" aria-label="Mobile navigation">
            <div class="topbar-action-row">
                <button onclick="window.location.href='../home/'">Home</button>
                <button onclick="window.location.href='../profile/'">Profile</button>
                <button onclick="window.location.href='../activity/'">Activity</button>
            </div>
            <div class="topbar-action-row">
                <button onclick="window.location.href='../../communities/communities/'">Communities</button>
                <button onclick="window.location.href='../map/'">Map</button>
                <button onclick="window.location.href='../settings/'">Settings</button>
            </div>
        </div>
    </div>
    <div class="sidebar">
        <button onclick="window.location.href='../home/'" class="sidebarButton">Home</button>
        <button onclick="window.location.href='../profile/'" class="sidebarButton">Profile</button>
        <button onclick="window.location.href='../activity/'" class="sidebarButton">Activity</button>
        <div class="divider"></div>
        <button class="sidebarButton" onclick="window.location.href='../../communities/communities/'">Communities</button>
        <button class="sidebarButton" onclick="window.location.href='../map/'">Map</button>
        <div class="divider"></div>
        <button class="sidebarButton" onclick="window.location.href='../settings/'">Settings</button>
        <button type="button" class="sidebarButton supporter-button" onclick="window.location.href = '../supporter/'">Buy Bloom Supporter</button>
    </div>
    <div class="main-layout">
        <div class="feed-container">
            
            <div class="sidebar-profile">
                <div class="CenterLayout">
                    <div class="pfp-frame"></div>
                    <select id="communitySelect" class="composer-select"></select>
                    <div class="post-type-selector" role="radiogroup" aria-label="Post type">
                        <button type="button" class="post-type-option is-selected" data-post-type="post" data-i18n-key="postType.post" data-i18n-ignore aria-pressed="true">Post</button>
                        <button type="button" class="post-type-option" data-post-type="activity" data-i18n-key="postType.activity" data-i18n-ignore aria-pressed="false">Activity</button>
                    </div>
                    <input type="text" id="titleInput" aria-label="Post title" placeholder="Post title" maxlength="200">
                    <input type="text" class="TypeInput" id="postInput" aria-label="Post content" placeholder="Write your post" maxlength="10000">
                    <input type="file" id="postImageInput" class="post-image-input" accept="image/jpeg,image/png,image/webp,image/gif" aria-label="Add image">
                    <div id="postImagePreview" class="post-image-preview" hidden></div>
                    <div class="post-composer-actions">
                        <button type="button" id="postImageButton" class="post-image-picker" aria-label="Add image" title="Add image"><i class="ri-file-image-line"></i></button>
                        <button type="button" id="createPostButton">Post</button>
                    </div>
                </div>
            </div>
            <div class="feed-updates">
                <div id="feed"></div>

            </div>
        </div>
    </div>
</body>
<script type="module" src="../../../js/i18n.js"></script>
<script type="module" src="../../../js/home.js"></script>
</html>
