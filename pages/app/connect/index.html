<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bloom - Connect</title>
    <link rel="icon" href="../../../Assets/BloomLogo.png" type="image/png">
    <link rel="stylesheet" href="../../../css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="app-page connect-page">
    <div class="topbar">
        <h1 class="topbar-logo">Bloom <span id="verText">ALPHA</span></h1>
        <nav aria-label="Account" style="display:flex;align-items:center">
            <p id="username-label" style="margin:10px"></p>
            <div class="pfp-frame"></div>
        </nav>
        <div class="topbar-actions" aria-label="Mobile navigation"></div>
    </div>
    <aside class="sidebar">
        <button onclick="window.location.href='../home/'" class="sidebarButton">Home</button>
        <button onclick="window.location.href='../profile/'" class="sidebarButton">Profile</button>
        <button onclick="window.location.href='../calendar/'" class="sidebarButton">Calendar</button>
        <div class="divider"></div>
        <button onclick="window.location.href='../../communities/communities/'" class="sidebarButton">Communities</button>
        <button onclick="window.location.href='../map/'" class="sidebarButton">Map</button>
        <div class="divider"></div>
        <button onclick="window.location.href='../settings/'" class="sidebarButton">Settings</button>
        <button type="button" class="sidebarButton supporter-button" onclick="window.location.href='../supporter/'">Buy Bloom Supporter</button>
    </aside>
    <main class="main-layout">
        <section class="settings-container connect-panel">
            <h1>Connect</h1>
            <p>Connect can alert you when you cross paths with an opted-in member of one of your communities.</p>
            <p id="connectPageStatus" class="settings-help" aria-live="polite">Checking Connect...</p>
            <button id="manageConnectButton" type="button">Manage Connect Settings</button>
            <div class="divider"></div>
            <h2>Connected people</h2>
            <div id="connectedUsers" class="connected-users" aria-live="polite"></div>
        </section>
    </main>
    <script type="module" src="../../../js/i18n.js"></script>
    <script type="module" src="../../../js/connect-page.js"></script>
</body>
</html>
