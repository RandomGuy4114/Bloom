<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - Supporter</title>
    <link rel="icon" href="../../../Assets/BloomLogo.png" type="image/png">
    <link rel="stylesheet" href="../../../css/styles.css">
</head>
<body class="app-page">
    <div class="topbar">
        <h1 class="topbar-logo">Bloom <p id="verText">ALPHA</p></h1>
        <nav style="display: flex; align-items: center;">
            <p id="username-label" style="margin: 10px;"></p>
            <div class="pfp-frame"></div>
        </nav>
        <div class="topbar-actions" aria-label="Mobile navigation">
            <div class="topbar-action-row">
                <button onclick="window.location.href='../home/'">Home</button>
                <button onclick="window.location.href='../profile/'">Profile</button>
                <button onclick="window.location.href='../activity/'">Activity</button>
            </div>
            <div class="topbar-action-row">
                <button onclick="window.location.href='../../communities/communities/'">Communities</button>
                <button onclick="window.location.href='../map/'">Map</button>
                <button onclick="window.location.href='../settings/'">Settings</button>
            </div>
        </div>
    </div>
    <div class="sidebar">
        <button onclick="window.location.href='../home/'" class="sidebarButton">Home</button>
        <button onclick="window.location.href='../profile/'" class="sidebarButton">Profile</button>
        <button onclick="window.location.href='../activity/'" class="sidebarButton">Activity</button>
        <div class="divider"></div>
        <button class="sidebarButton" onclick="window.location.href='../../communities/communities/'">Communities</button>
        <button class="sidebarButton" onclick="window.location.href='../map/'">Map</button>
        <div class="divider"></div>
        <button class="sidebarButton" onclick="window.location.href='../settings/'">Settings</button>
        <button type="button" class="sidebarButton supporter-button" aria-current="page">Buy Bloom Supporter</button>
    </div>
    <main class="main-layout">
        <section class="settings-container supporter-container">
            <h1>Buy Bloom Supporter</h1>
            <p>Bloom Supporter is a premium subscription that helps support the development of Bloom and unlocks additional features.</p>
            <p>Bloom Supporter Costs:</p>
            <h2 id="SupportPriceElement"></h2>
            <button id="buySupporterButton">Buy Bloom Supporter</button>
        </section>
    </main>

    <script type="module" src="../../../js/i18n.js"></script>
    <script type="module" src="../../../js/supporter.js"></script>
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
</body>
</html>
