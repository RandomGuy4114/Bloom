<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - Calendar</title>
    <link rel="icon" href="../../../Assets/BloomLogo.png" type="image/png">
    <link rel="stylesheet" href="../../../css/styles.css">
</head>
<body class="app-page">
    <div class="topbar">
        <h1 class="topbar-logo">Bloom <p id="verText">ALPHA</p></h1>
        <nav style="display: flex; align-items: center;">
            <p id="username-label" style="margin: 10px;"></p>
            <div class="pfp-frame"></div>
        </nav>
        <div class="topbar-actions" aria-label="Mobile navigation">
            <div class="topbar-action-row">
                <button onclick="window.location.href='../home/'">Home</button>
                <button onclick="window.location.href='../profile/'">Profile</button>
                <button onclick="window.location.href='../calendar/'">Calendar</button>
            </div>
            <div class="topbar-action-row">
                <button onclick="window.location.href='../../communities/communities/'">Communities</button>
                <button onclick="window.location.href='../map/'">Map</button>
                <button onclick="window.location.href='../settings/'">Settings</button>
            </div>
        </div>
    </div>
    <div class="sidebar">
        <button onclick="window.location.href='../home/'" class="sidebarButton">Home</button>
        <button onclick="window.location.href='../profile/'" class="sidebarButton">Profile</button>
        <button onclick="window.location.href='../calendar/'" class="sidebarButton">Calendar</button>
        <div class="divider"></div>
        <button class="sidebarButton" onclick="window.location.href='../../communities/communities/'">Communities</button>
        <button class="sidebarButton" onclick="window.location.href='../map/'">Map</button>
        <div class="divider"></div>
        <button class="sidebarButton" onclick="window.location.href='../settings/'">Settings</button>
        <button type="button" class="sidebarButton supporter-button" onclick="window.location.href = '../supporter/'">Buy Bloom Supporter</button>
    </div>
    <main class="main-layout" aria-label="Calendar">
        <div class="CalendarContainer" id="calendar-container">
            <div class="month" id="monthYearContainer">
                <ul>
                    <button id="prev">&#10094;</button>
                    <button id="next">&#10095;</button>
                    <li id="monthYear">Placeholder<br><span id="year">2026</span></li>
                </ul>
            </div>
            <ul class="weekdays" id="weekdaysContainer">
                <li>Sun</li>
                <li>Mon</li>
                <li>Tue</li>
                <li>Wed</li>
                <li>Thu</li>
                <li>Fri</li>
                <li>Sat</li>
            </ul>
            <ul class="days" id="daysContainer">
                <!-- Days will be dynamically generated here -->
            </ul>
        </div>
        <div id="eventDetailsContainer">
        <!-- Click a day on the calendar to see events -->
        </div>
    </main>
</body>
<script type="module" src="../../../js/i18n.js"></script>
<script type="module" src="../../../js/calendar.js"></script>
</html>
