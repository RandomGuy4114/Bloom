<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - Activity</title>
    <link rel="icon" href="../../../Assets/BloomLogo.png" type="image/png">
    <link rel="stylesheet" href="../../../css/styles.css">
</head>
<body class="app-page">
    <div class="topbar">
        <h1 class="topbar-logo">Bloom <p id="verText">ALPHA</p></h1>
        <nav style="display: flex; align-items: center;">
            <p id="username-label" style="margin: 10px;">Activity</p>
            <div class="pfp-frame"></div>
        </nav>
        <div class="topbar-actions" aria-label="Mobile navigation">
            <div class="topbar-action-row">
                <button onclick="window.location.href='../home/'">Home</button>
                <button onclick="window.location.href='../profile/'">Profile</button>
                <button onclick="window.location.href='../activity/'">Activity</button>
            </div>
            <div class="topbar-action-row">
                <button onclick="window.location.href='../../communities/communities/'">Communities</button>
                <button onclick="window.location.href='../settings/'">Settings</button>
            </div>
        </div>
    </div>
    <div class="sidebar">
        <button onclick="window.location.href='../home/'" class="sidebarButton">Home</button>
        <button onclick="window.location.href='../profile/'" class="sidebarButton">Profile</button>
        <button onclick="window.location.href='../activity/'" class="sidebarButton">Activity</button>
        <div class="divider"></div>
        <button class="sidebarButton" onclick="window.location.href='../../communities/communities/'">Communities</button>
        <div class="divider"></div>
        <button class="sidebarButton" onclick="window.location.href='../settings/'">Settings</button>
    </div>
    <div class="main-layout">
        <div class="feed-container">
            <div class="activities-profile">
                <h1 style="text-align: center;">Activity</h1>
                <p style="text-align: center; color: grey;">Here you can view your recent activity and nearby activity.</p>
                <div class="divider"></div>
                <div class="activity-search">
                    <input type="search" id="activitySearchInput" aria-label="Search activity" placeholder="Search activities" style="padding: 10px; width: 90%; border-radius: 5px; border: 1px solid #ccc; height: 40px;">
                </div>
                <div class="divider"></div>
                <div class="activity-filters">
                    <button type="button" class="filter-button is-active" data-activity-filter="all" aria-pressed="true">All</button>
                    <button type="button" class="filter-button" data-activity-filter="my" aria-pressed="false">My Activity</button>
                    <button type="button" class="filter-button" data-activity-filter="nearby" aria-pressed="false">Nearby</button>
                </div>
                <div class="divider"></div>
                <div id="activityFeedContainer" class="posts-container"></div>
            </div>
            <div class="eventsFeedContainer">
                    <h1>Events</h1>
                    <p style="text-align: center; color: grey;">Here you can view upcoming events in your area.</p>
                    <div class="divider"></div>
                    <div class="event-search">
                        <input type="search" id="eventSearchInput" aria-label="Search events" placeholder="Search events" style="padding: 10px; width: 90%; border-radius: 5px; border: 1px solid #ccc; height: 40px;">
                    </div>
                    <div class="event-filters" style="margin-top: 10px; text-align: center;">
                        <button type="button" class="filter-button is-active" data-event-filter="all" aria-pressed="true">All</button>
                        <button type="button" class="filter-button" data-event-filter="my" aria-pressed="false">My Events</button>
                        <button type="button" class="filter-button" data-event-filter="nearby" aria-pressed="false">Nearby</button>
                        <button type="button" class="search-button" id="eventSearchButton">Search</button>
                    </div>
                    <div class="divider"></div>
                    <div id="eventFeedContainer" class="posts-container"></div>
                    </div>
                </div>
        </div>
</body>
<script type="module" src="../../../js/i18n.js"></script>
<script type="module" src="../../../js/activity.js"></script>
</html>
