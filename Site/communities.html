<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="topbar">
        <h1 class="topbar-logo">Bloom</h1>
        <nav>
            <button>My Communities</button>
            <button>Home</button>
            <button class="activity-button">Activity</button> <!-- This Button Is Only Visible On Mobile Devices -->
            <button>Profile</button>
        </nav>
    </div>
    <div class="main-layout">
        <div class="communities-profile">
            <h1>My Communities</h1>
            <div class="posts-container">
                <div class="community">
                    <h2>Community Name</h2>
                    <p>Community description goes here...</p>
                    <button style="padding: 10px">View Community</button>
                </div>
            </div>
        </div>
        <div class="feed-updates">
            <h1>Communities</h1>
            <div class="posts-container">
                <div class="community">
                    <h2>Community Name</h2>
                    <p>Community description goes here...</p>
                    <p>Members: placeholder</p>
                    <div class="com-buttons">
                        <button style="padding: 10px">View Community</button>
                        <button style="padding: 10px">Join Community</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
