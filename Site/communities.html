<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="topbar">
        <h1 class="topbar-logo">Bloom</h1>
        <nav>
            <button onclick="window.location.href='communities.html'">My Communities</button>
            <button onclick="window.location.href='home.html'">Home</button>
            <button onclick="window.location.href='profile.html'">Profile</button>
        </nav>
    </div>
    <div class="main-layout">
        <div class="communities-profile">
            <h1 style="text-align: center;">My Communities</h1>
            <input type="text" id="searchInput" placeholder="Search My Communities" style="width: 90%; margin-bottom: 10px;">
            <div id="my-communities-container" class="posts-container">
                <div class="community">
                    <h2>Community Name</h2>
                    <p>Community description goes here...</p>
                    <button style="padding: 10px">View Community</button>
                </div>
            </div>
        </div>
        <div class="feed-updates">
            <h1>Communities</h1>
            <input type="text" id="searchInput" placeholder="Search Communities" style="width: 90%; margin-bottom: 10px;">
            <div class="posts-container" id="communities-container">
            </div>
        </div>
    </div>
</body>
<script type="module" src="../js/communities.js"></script>
</html>
