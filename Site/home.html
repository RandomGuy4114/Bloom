<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="topbar">
        <h1 class="topbar-logo">Bloom</h1>
        <nav>
            <button>My Communities</button>
            <button>Home</button>
            <button class="activity-button">Activity</button> <!-- This Button Is Only Visible On Mobile Devices -->
            <button>Profile</button>
        </nav>
    </div>
    <div class="main-layout">
        <div class="sidebar-profile">
            <h1>Me</h1>
            <div class="posts-container">
                <div class="post">
                    <h2>Post Title</h2>
                    <p>Post content goes here...</p>
                </div>
            </div>
        </div>
        <div class="feed-updates">
            <h1>Updates</h1>
        </div>
        <div class="info-container">
            <h1>Activity</h1>
            <p>0 New Messages</p>
            <p>0 New Events</p>
        </div>
    </div>
</body>
</html>
