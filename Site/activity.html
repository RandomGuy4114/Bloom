<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="app-page">
    <div class="topbar">
        <h1 class="topbar-logo">Bloom <p id="verText">ALPHA</p></h1>
        <nav style="display: flex; align-items: center;">
            <p id="username-label" style="margin: 10px;">Activity</p>
            <div class="pfp-frame"></div>
        </nav>
        <div class="topbar-actions" aria-label="Mobile navigation">
            <div class="topbar-action-row">
                <button onclick="window.location.href='home.html'">Home</button>
                <button onclick="window.location.href='profile.html'">Profile</button>
                <button onclick="window.location.href='activity.html'">Activity</button>
            </div>
            <div class="topbar-action-row">
                <button onclick="window.location.href='messages.html'">Messages</button>
                <button onclick="window.location.href='communities.html'">Communities</button>
                <button onclick="window.location.href='settings.html'">Settings</button>
            </div>
        </div>
    </div>
    <div class="sidebar">
        <button onclick="window.location.href='home.html'" class="sidebarButton">Home</button>
        <button onclick="window.location.href='profile.html'" class="sidebarButton">Profile</button>
        <button onclick="window.location.href='activity.html'" class="sidebarButton">Activity</button>
        <button class="sidebarButton" onclick="window.location.href='messages.html'">Messages</button>
        <div class="divider"></div>
        <button class="sidebarButton" onclick="window.location.href='communities.html'">Communities</button>
        <div class="divider"></div>
        <button class="sidebarButton" onclick="window.location.href='settings.html'">Settings</button>
    </div>
    <div class="rightBar">
        <p style="margin: 10px;">Recent Activity</p>
    </div>
    <div class="main-layout">
        <div class="feed-container">
            <div class="activities-profile">
                <h1 style="text-align: center;">Activity</h1>
                <p style="text-align: center; color: grey;">Here you can view your recent activity and nearby activity.</p>
                <div class="divider"></div>
                <div class="activity-search">
                    <input type="text" id="activitySearchInput" placeholder="Search activity..." style="padding: 2px; width: 100%; border-radius: 5px; border: 1px solid #ccc; height: 50px;">
                </div>
                <div class="divider"></div>
                <div class="activity-filters">
                    <button class="filter-button" onclick="filterActivity('all')">All</button>
                    <button class="filter-button" onclick="filterActivity('my')">My Activity</button>
                    <button class="filter-button" onclick="filterActivity('nearby')">Nearby</button>
                </div>
                <div class="divider"></div>
                <div id="activityFeedContainer" class="posts-container">
                    <div class="activity-post">
                        <h2>Post Title</h2>
                        <p>Post content goes here...</p>
                    </div>
                </div>
            </div>
            <div class="eventsFeedContainer">
                    <h1>Events</h1>
                    <p style="text-align: center; color: grey;">Here you can view upcoming events in your area.</p>
                    <div class="divider"></div>
                    <div class="event-search">
                        <input type="text" id="eventSearchInput" placeholder="Search events..." style="padding: 2px; width: 100%; border-radius: 5px; border: 1px solid #ccc; height: 50px;">
                    </div>
                    <div class="event-filters" style="margin-top: 10px; text-align: center;">
                        <button class="filter-button" onclick="filterEvents('all')">All</button>
                        <button class="filter-button" onclick="filterEvents('my')">My Events</button>
                        <button class="filter-button" onclick="filterEvents('nearby')">Nearby</button>
                        <button class="search-button" onclick="searchEvents(document.getElementById('eventSearchInput').value)">Search</button>
                    </div>
                    <div class="divider"></div>
                    <div class="post">
                        <h2 style="text-align: center;">Event Title</h2>
                        <p style="text-align: center;">Event details go here...</p>
                        <p style="text-align: center; color: grey;">Event Date: (placeholder)</p>
                        <button style="display: block; margin: 0 auto;" onclick="window.location.href='eventDetails.html'">View Event</button>
                    </div>
                    </div>
                </div>
        </div>
    </div>
</body>
</html>
