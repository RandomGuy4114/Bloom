<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - Profile</title>
    <link rel="icon" href="Assets/BloomLogo.png" type="image/png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="profile-page">
    <div class="topbar">
        <h1 class="topbar-logo">Bloom <p id="verText">ALPHA</p></h1>
        <nav style="display: flex; align-items: center;">
            <p id="username-label" style="margin: 10px;"></p>
            <div class="pfp-frame"></div>
        </nav>
        <div class="topbar-actions" aria-label="Mobile navigation">
            <div class="topbar-action-row">
                <button onclick="window.location.href='home.html'">Home</button>
                <button onclick="window.location.href='profile.html'">Profile</button>
                <button onclick="window.location.href='activity.html'">Activity</button>
            </div>
            <div class="topbar-action-row">
                <button onclick="window.location.href='communities.html'">Communities</button>
                <button onclick="window.location.href='settings.html'">Settings</button>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <button onclick="window.location.href='home.html'" class="sidebarButton">Home</button>
        <button onclick="window.location.href='profile.html'" class="sidebarButton">Profile</button>
        <button onclick="window.location.href='activity.html'" class="sidebarButton">Activity</button>
        <div class="divider"></div>
        <button class="sidebarButton" onclick="window.location.href='communities.html'">Communities</button>
        <div class="divider"></div>
        <button class="sidebarButton" onclick="window.location.href='settings.html'">Settings</button>
    </div>

    <div class="main-layout" style="margin-top: var(--topbar-height);">
        <div class="feed-container" style="gap: 20px; width: 100%;">
            
            <div class="profile-sidebar">
                <div class="profile-pfp"></div>
                <h2 class="profile-name"></h2>
                <div class="profile-details"></div>
            </div>

            <div class="profile-posts">
                <h2>My Posts</h2>
                <div class="posts-container"></div>
            </div>

        </div>
    </div>
    <script type="module" src="../js/i18n.js"></script>
    <script type="module" src="../js/profile.js"></script>
</body>
</html>
