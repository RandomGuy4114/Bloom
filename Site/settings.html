<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="app-page">
    <div class="topbar">
        <h1 class="topbar-logo">Bloom <p id="verText">ALPHA</p></h1>
        <nav style="display: flex; align-items: center;">
            <p id="username-label" style="margin: 10px;">Communities</p>
            <div class="pfp-frame"></div>
        </nav>
        <div class="topbar-actions" aria-label="Mobile navigation">
            <div class="topbar-action-row">
                <button onclick="window.location.href='home.html'">Home</button>
                <button onclick="window.location.href='profile.html'">Profile</button>
                <button onclick="window.location.href='activity.html'">Activity</button>
            </div>
            <div class="topbar-action-row">
                <button onclick="window.location.href='messages.html'">Messages</button>
                <button onclick="window.location.href='communities.html'">Communities</button>
                <button onclick="window.location.href='settings.html'">Settings</button>
            </div>
        </div>
    </div>
    <div class="sidebar">
        <button onclick="window.location.href='home.html'" class="sidebarButton">Home</button>
        <button onclick="window.location.href='profile.html'" class="sidebarButton">Profile</button>
        <button onclick="window.location.href='activity.html'" class="sidebarButton">Activity</button>
        <button class="sidebarButton" onclick="window.location.href='messages.html'">Messages</button>
        <div class="divider"></div>
        <button class="sidebarButton" onclick="window.location.href='communities.html'">Communities</button>
        <div class="divider"></div>
        <button class="sidebarButton" onclick="window.location.href='settings.html'">Settings</button>
    </div>
    <div class="rightBar">
        <p style="margin: 10px;">Next Steps</p>
        <div class="roadmap-list">
            <div class="roadmap-item">
                <strong>Messages</strong>
                <p>Open the new inbox page and wire real conversations.</p>
            </div>
            <div class="roadmap-item">
                <strong>Media posts</strong>
                <p>Add image upload support for richer updates.</p>
            </div>
            <div class="roadmap-item">
                <strong>Notifications</strong>
                <p>Show likes, replies, and community activity in one feed.</p>
            </div>
        </div>
    </div>
    <div class="main-layout">
        <div class="settings-container">
            <h1 style="text-align: center;">Settings</h1>
            <div class="settings-section">
                <h2>Account Settings</h2>
                <button id="changePasswordButton">Change Password</button>
                <button id="deleteAccountButton">Delete Account</button>
            </div>
            <div class="settings-section">
                <h2>Style Settings</h2>
                <label for="themeSelect">Theme:</label>
                <select id="themeSelect">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </div>
        </div>
    </div>
</body>
<script type="module" src="../js/settings.js"></script>
</html>
