<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom | Login</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="CenterBox">
        <h1 style="text-align: center; margin-bottom: 0;">Welcome Back To Bloom!</h1>
        <p style="text-align: center; margin-top: 4px; font-size: 14px; color: grey;">Please enter your credentials to access your account.</p>
        <input type="text" placeholder="Username / Email" style="margin-top: 20px; padding: 10px; width: 250px; border-radius: 5px; border: 1px solid #ccc;">
        <input type="password" placeholder="Password" style="margin-top: 10px; padding: 10px; width: 250px; border-radius: 5px; border: 1px solid #ccc;">
        <button id="GoogleLogin">Log In With Google</button>
        <p style="font-size: 15px; color: grey;">Don't have an account? <a href="register.html">Sign up</a></p>
        <button id="LoginButton">Log In</button>
        
    </div>
</body>
