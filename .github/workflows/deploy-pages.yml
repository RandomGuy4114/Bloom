name: Deploy React site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for legacy Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.sha;

            for (let attempt = 0; attempt < 60; attempt += 1) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: headSha,
                per_page: 100,
              });

              const legacyRun = data.workflow_runs.find(
                (run) => run.name === "pages-build-deployment",
              );

              if (legacyRun?.status === "completed") {
                core.info(`Legacy Pages run finished with ${legacyRun.conclusion}.`);
                return;
              }

              core.info("Waiting for the legacy Pages run to finish...");
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }

            core.warning("Legacy Pages run was not found or did not finish in five minutes.");

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
