server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Emit relative redirects so the browser keeps the original host:port
    # (otherwise the mapped port, e.g. 8080, gets dropped).
    absolute_redirect off;

    # The app's HTML lives in /Site and references ../js for its ES modules,
    # so we serve the whole project root and send visitors to the entry page.
    location = / {
        return 302 /Site/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Long-lived caching for static assets; HTML stays uncached so updates show up.
    location ~* \.(?:css|js|png|webp|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
